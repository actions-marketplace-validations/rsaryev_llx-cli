name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Where the jobs run: check, size and site on the project's own runners (`self-hosted`, `llx`:
# scripts/runner/, one job per fresh container, the compiler's cache sccache kept between them), a
# pull request from a fork on GitHub's: its code never reaches a machine of ours. A fork's pull
# request can rewrite this file, so the repository also asks a maintainer to approve the runs of
# every outside contributor (Settings, Actions, "Require approval for all external
# contributors"): read the change to the workflows before approving. The action job always runs on
# GitHub's runner, the one with passwordless sudo and docker's socket that action/test.sh drops
# for real.
#
# Third-party actions are pinned to a commit: a moved tag or branch cannot change what runs.
#
# Each check is a step `scripts/check --only NAME`: the commands live in scripts/checks/run.sh, the
# same ones the git hooks, Claude Code's Stop hook and `scripts/check --all` run, so CI and a
# laptop cannot drift. `scripts/check --list` names them.
#
# A new push to a pull request supersedes its running checks; on main every commit keeps its own
# run, so a red commit is never hidden by the one after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A fresh runner gains nothing from debug info or incremental state: both only slow the build.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # One job, so the dependencies compile once: format, lint, then the tests. Linux only: a macOS runner
  # costs ten times as much, and the release workflow tests both. Coverage and the MSRV are
  # checked by hand (`scripts/check --all --coverage`, `cargo +1.88 check`, RELEASING.md); the
  # binary's size by the size job.
  check:
    name: check
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "llx"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
      - run: scripts/check --only fmt
      - run: scripts/check --only clippy
      - run: scripts/check --only test

  # The release binary (ARCHITECTURE.md, Budgets): it fails above 5 MiB and warns above 4 MB
  # (AGENTS.md's goal).
  size:
    name: size
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "llx"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
      - run: scripts/check --only size

  # The site's types, build and prerender, as the site workflow builds it before it publishes.
  site:
    name: site
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "llx"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: scripts/check --only site

  # The GitHub Action and its example workflows, with no model and no network but the pinned
  # linters' downloads (scripts/checks/tools.sh), each checked against its hash. action/test.sh
  # runs the action's script on a stub llx; shellcheck reads every shell script of the repository.
  # actionlint reads the workflows and the examples as they are, then the examples again on this
  # checkout's action.yml (`uses: ./`), which checks each input and output they name against it.
  # The examples' schemas must parse, every job has a time limit, every llx step names its model,
  # and each action is used at one version in all of them. Then scripts/check's own tests and the
  # Markdown's relative links, and gitleaks on every commit (the whole history: a shallow clone would
  # read the last one only).
  action:
    name: action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/check --only shellcheck
      - run: scripts/check --only action
      - run: scripts/check --only actionlint
      - name: The examples' schemas, limits, models and versions
        run: scripts/check --only examples
      - run: scripts/check --only check-test,mdlinks
      - run: scripts/check --only secrets
