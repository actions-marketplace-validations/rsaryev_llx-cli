[package]
name = "tools"
description = "The agent's tools: shell commands, patches to files, questions to the person"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The tool protocol only (rule L3): a tool knows nothing of the loop or the model.
[dependencies]
# Images go to the model as base64.
base64.workspace = true
contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
# The unix calls std has no wrapper for: a command's own session and its kill (setsid, kill), the
# sandboxes' system calls, the listing of processes and descriptors.
libc.workspace = true

[lints]
workspace = true
