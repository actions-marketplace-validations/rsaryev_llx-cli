<text x="28.0" y="578.0" fill="#9198a1" font-size="11.5">Each panel has its own scale; the number beside a bar is the measurement. Every figure comes from a binary in bench/.</text>
<text x="28.0" y="595.0" fill="#9198a1" font-size="11.5">pulldown-cmark gives events and builds no tree: its events are dropped as they come, the least it can be asked for.</text>
<text x="28.0" y="612.0" fill="#9198a1" font-size="11.5">Every parser built for speed (opt-level 3, fat LTO); the median of 51 rounds. Apple M5, Darwin 25.6.0, rustc 1.96.1 (31fca3adb 2026-06-26).</text>
